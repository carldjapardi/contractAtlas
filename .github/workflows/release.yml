name: Publish demo release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
        env:
          TELEMETRY_DISABLED: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage release and upload demo materials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Contract Atlas $RELEASE_TAG — Live Cognee Demo" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            DEMO_SCRIPT.md HOSTED_RESULTS.md COMPARISON_RESULTS.md \
            docs/images/contract-atlas-live.jpg
          gh release edit "$RELEASE_TAG" --draft=false --latest
