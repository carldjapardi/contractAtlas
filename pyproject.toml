[project]
name = "contract-atlas"
version = "0.1.0"
description = "Evidence-first exploration of federal contract relationships"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
cognee = ["cognee==1.6.8"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
