name: Remove unintended demo release

on:
  push:
    branches: [Main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove only the release and tag created by this session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" --jq .id 2>/dev/null || true)
          if [ "$release_id" = "448134125" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/448134125"
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" --jq .object.sha 2>/dev/null || true)
          if [ "$tag_sha" = "43e6720a69aad222c4f4834b20cad85469c5df75" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.0"
          fi
